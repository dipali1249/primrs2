# .github/workflows/sieve-finder.yml
#
# Sieve Prime Finder — GitHub Actions workflow
# Uses the Segmented Sieve of Eratosthenes, server-side.
# 12 runs/day × 5 minutes = 60 minutes/day total.
#
# Place this file at: .github/workflows/sieve-finder.yml

name: Sieve Prime Finder

on:
  schedule:
    # Every 2 hours at :00 (UTC) — 00:00, 02:00, 04:00, … 22:00
    - cron: '0 */2 * * *'
  workflow_dispatch:   # allow manual "Run workflow" from the Actions tab

permissions:
  contents: write      # needed to commit state.json + index.html back

concurrency:
  group: sieve-prime-finder
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 110

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run sieve prime finder (5-minute session)
        run: python sieve_prime_finder.py
        env:
          SESSION_SECONDS: '6000'
          SEGMENT_SIZE: '500000000'

      - name: Commit updated state and report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: sieve prime finder session $(date -u +%Y-%m-%dT%H:%M)Z"
            git push
          fi
